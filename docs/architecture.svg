  <text x="278" y="70" font-size="13" font-weight="700" fill="#4a4658">or</text>
  <use href="#i-robot" x="228" y="76" width="38" height="38"/>
  <text x="137" y="128" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6c7180">you</text>
  <text x="247" y="128" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6c7180">an AI agent</text>
