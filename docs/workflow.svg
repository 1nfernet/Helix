<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#878d9b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="298" rx="16" fill="#ffffff" stroke="#e3e7ee"/>

  <!-- sources -->
  <g font-size="13" fill="#12151f">
    <rect x="30" y="66" width="150" height="56" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="105" y="90" text-anchor="middle" font-weight="600">Scientist</text>
    <text x="105" y="108" text-anchor="middle" font-size="11" fill="#878d9b">writes / edits</text>
    <rect x="30" y="150" width="150" height="56" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="105" y="174" text-anchor="middle" font-weight="600">AI agent</text>
    <text x="105" y="192" text-anchor="middle" font-size="11" fill="#878d9b">writes / edits</text>
  </g>
  <line x1="180" y1="94"  x2="246" y2="120" stroke="#878d9b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="180" y1="178" x2="246" y2="152" stroke="#878d9b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- spec (the reviewable artifact) -->
  <rect x="250" y="80" width="164" height="112" rx="12" fill="#ecebfb" stroke="#5b53e0" stroke-width="1.5"/>
  <text x="332" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#5b53e0">Helix spec</text>
  <text x="332" y="132" text-anchor="middle" font-size="11" fill="#6b62c9">the reviewable artifact</text>
  <text x="332" y="162" text-anchor="middle" font-size="12" fill="#4840c4">diff · version · review</text>

  <!-- trust boundary -->
  <text x="446" y="46" text-anchor="middle" font-size="10.5" letter-spacing="1.2" font-weight="700" fill="#b07d16">TRUST BOUNDARY</text>
  <line x1="446" y1="58" x2="446" y2="228" stroke="#d9ab53" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="414" y1="136" x2="474" y2="136" stroke="#878d9b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- compiler -->
  <rect x="476" y="80" width="212" height="112" rx="12" fill="#f8f8fe" stroke="#5b53e0" stroke-width="2"/>
  <text x="582" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#5b53e0">Deterministic compiler</text>
  <text x="582" y="134" text-anchor="middle" font-size="11" fill="#878d9b">tested · deterministic</text>
  <text x="582" y="162" text-anchor="middle" font-size="12" fill="#525863">safety-screened · solves constraints</text>
  <line x1="688" y1="136" x2="736" y2="136" stroke="#878d9b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- verified design -->
  <rect x="738" y="80" width="192" height="112" rx="12" fill="#e0f2ec" stroke="#0f9271" stroke-width="1.5"/>
  <text x="834" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b53">Verified design</text>
  <text x="834" y="134" text-anchor="middle" font-size="11" fill="#2f7d66">provenance-stamped</text>
  <text x="834" y="162" text-anchor="middle" font-size="12" fill="#2f5b4c">reproducible · auditable</text>

  <!-- caption -->
  <line x1="30" y1="244" x2="930" y2="244" stroke="#eef1f6"/>
  <text x="480" y="272" text-anchor="middle" font-size="12.5" fill="#525863">Agents may only <tspan font-weight="600" fill="#12151f">emit or edit a spec</tspan> — only the tested compiler produces the design, so the same audit trail that protects a human protects an agent.</text>
</svg>
