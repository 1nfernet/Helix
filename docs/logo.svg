<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" role="img" aria-label="Helix logo — a double helix">
  <title>Helix</title>
  <!-- The same mark the app draws in its wordmark (App.tsx), same geometry, so the
       README and the product show one logo rather than two. Two deliberate
       differences from the in-app version:
       1. Values are literal rather than CSS custom properties, which an SVG
          embedded via <img> cannot see.
       2. The second strand is a mid neutral rather than the ink token (#12151f),
          which would vanish against GitHub's dark theme.
       Indigo plus neutrals, no gradient. The gradient violet/green mark this
       replaces was off system on both counts, and its green strand read as the
       status green (see The Status-Is-Earned Rule in DESIGN.md).
       NB: no double hyphens anywhere in here; XML forbids them inside a comment. -->
  <path d="M7 3c0 5 10 6 10 9s-10 4-10 9" stroke="#5b53e0" stroke-width="2" stroke-linecap="round"/>
  <path d="M17 3c0 5-10 6-10 9s10 4 10 9" stroke="#7f8794" stroke-width="2" stroke-linecap="round"/>
  <path d="M8.5 6.5h7M8.5 17.5h7M6.7 12h10.6" stroke="#b6bcc8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
