<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#878d9b"/>
    </marker>
    <marker id="arwup" markerWidth="9" markerHeight="9" refX="3" refY="1" orient="auto">
      <path d="M0,6 L3,0 L6,6 Z" fill="#c9c1f2"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="498" rx="16" fill="#ffffff" stroke="#e3e7ee"/>

  <!-- interfaces -->
  <text x="32" y="46" font-size="10.5" letter-spacing="1.2" fill="#878d9b" font-weight="600">DRIVE IT VIA</text>
  <g font-size="12" font-weight="600" fill="#4840c4">
    <rect x="150" y="30" width="60" height="26" rx="13" fill="#ecebfb"/><text x="180" y="47" text-anchor="middle">CLI</text>
    <rect x="220" y="30" width="80" height="26" rx="13" fill="#ecebfb"/><text x="260" y="47" text-anchor="middle">Web UI</text>
    <rect x="310" y="30" width="126" height="26" rx="13" fill="#ecebfb"/><text x="373" y="47" text-anchor="middle">MCP · agents</text>
  </g>

  <!-- INTENT -->
  <rect x="32" y="104" width="212" height="168" rx="12" fill="#ffffff" stroke="#5b53e0" stroke-width="1.5"/>
  <text x="52" y="136" font-size="15" font-weight="700" fill="#5b53e0">Intent</text>
  <text x="52" y="160" font-size="12.5" fill="#12151f">Helix DSL  /  YAML spec</text>
  <line x1="52" y1="176" x2="224" y2="176" stroke="#eef1f6"/>
  <g font-size="12" fill="#525863">
    <text x="52" y="204">what to edit</text>
    <text x="52" y="228">under what constraints</text>
    <text x="52" y="252">with which models</text>
  </g>

  <!-- arrow intent -> compiler -->
  <text x="272" y="176" text-anchor="middle" font-size="10" fill="#878d9b">agents fill</text>
  <text x="272" y="189" text-anchor="middle" font-size="10" fill="#878d9b">the blanks</text>
  <line x1="244" y1="200" x2="300" y2="200" stroke="#878d9b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- COMPILER -->
  <rect x="300" y="90" width="358" height="196" rx="12" fill="#f8f8fe" stroke="#5b53e0" stroke-width="2"/>
  <text x="322" y="120" font-size="15" font-weight="700" fill="#5b53e0">Deterministic compiler</text>
  <text x="322" y="139" font-size="11" fill="#878d9b">solves your constraints — reports infeasibility</text>
  <g font-size="11" font-weight="600" fill="#4840c4">
    <rect x="322" y="152" width="62" height="26" rx="7" fill="#ecebfb"/><text x="353" y="169" text-anchor="middle">safety</text>
    <rect x="392" y="152" width="74" height="26" rx="7" fill="#ecebfb"/><text x="429" y="169" text-anchor="middle">strategy</text>
    <rect x="474" y="152" width="64" height="26" rx="7" fill="#ecebfb"/><text x="506" y="169" text-anchor="middle">target</text>
    <rect x="546" y="152" width="64" height="26" rx="7" fill="#ecebfb"/><text x="578" y="169" text-anchor="middle">guides</text>
    <rect x="322" y="186" width="76" height="26" rx="7" fill="#ecebfb"/><text x="360" y="203" text-anchor="middle">simulate</text>
    <rect x="406" y="186" width="92" height="26" rx="7" fill="#ecebfb"/><text x="452" y="203" text-anchor="middle">constraints</text>
    <rect x="506" y="186" width="70" height="26" rx="7" fill="#ecebfb"/><text x="541" y="203" text-anchor="middle">primers</text>
  </g>
  <line x1="322" y1="232" x2="636" y2="232" stroke="#eef1f6"/>
  <text x="322" y="256" font-size="11" fill="#525863">Same intent → same design. Every run is reproducible.</text>

  <!-- arrow compiler -> design -->
  <line x1="658" y1="200" x2="712" y2="200" stroke="#878d9b" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- DESIGN -->
  <rect x="714" y="104" width="212" height="168" rx="12" fill="#e0f2ec" stroke="#0f9271" stroke-width="1.5"/>
  <text x="734" y="136" font-size="15" font-weight="700" fill="#0b6b53">Design bundle</text>
  <line x1="734" y1="150" x2="906" y2="150" stroke="#c6e6da"/>
  <g font-size="12" fill="#2f5b4c">
    <text x="734" y="178">ranked guides / pegRNAs</text>
    <text x="734" y="202">delivery + validation primers</text>
    <text x="734" y="226">safety verdict</text>
    <text x="734" y="250">provenance (auditable)</text>
  </g>

  <!-- ADAPTERS -->
  <line x1="479" y1="340" x2="479" y2="288" stroke="#c9c1f2" stroke-width="1.5" marker-end="url(#arwup)"/>
  <text x="32" y="360" font-size="10.5" letter-spacing="1" fill="#878d9b" font-weight="600">INJECTABLE BACKENDS</text>
  <text x="205" y="360" font-size="11.5" fill="#525863">— heuristic default ⇄ real tool, switched by a spec edit (not code)</text>
  <g font-size="11.5" fill="#12151f">
    <rect x="32" y="376" width="130" height="72" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="46" y="400" font-weight="600">sequence</text><text x="46" y="420" font-size="10.5" fill="#878d9b">inline · Ensembl</text><text x="46" y="435" font-size="10.5" fill="#878d9b">· NCBI</text>
    <rect x="176" y="376" width="150" height="72" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="190" y="400" font-weight="600">on/off-target</text><text x="190" y="420" font-size="10.5" fill="#878d9b">Doench · CFD /</text><text x="190" y="435" font-size="10.5" fill="#878d9b">Cas-OFFinder</text>
    <rect x="340" y="376" width="150" height="72" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="354" y="400" font-weight="600">edit outcome</text><text x="354" y="420" font-size="10.5" fill="#878d9b">inDelphi · BE-Hive</text><text x="354" y="435" font-size="10.5" fill="#878d9b">· PRIDICT</text>
    <rect x="504" y="376" width="130" height="72" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="518" y="400" font-weight="600">variants</text><text x="518" y="420" font-size="10.5" fill="#878d9b">Ensembl seed/</text><text x="518" y="435" font-size="10.5" fill="#878d9b">PAM SNPs</text>
    <rect x="648" y="376" width="130" height="72" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="662" y="400" font-weight="600">folding</text><text x="662" y="420" font-size="10.5" fill="#878d9b">ESMFold ·</text><text x="662" y="435" font-size="10.5" fill="#878d9b">AlphaFold3/Boltz</text>
    <rect x="792" y="376" width="134" height="72" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="806" y="400" font-weight="600">safety</text><text x="806" y="420" font-size="10.5" fill="#878d9b">biosecurity</text><text x="806" y="435" font-size="10.5" fill="#878d9b">screen</text>
  </g>
</svg>
